name: Quality checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.0

      - name: Synchronize locked environment
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check scripts tests

      - name: Check evaluation complexity
        run: uv run ruff check scripts/evaluate_risk_models.py --select C901

      - name: Check formatting
        run: uv run ruff format --check scripts tests

      - name: Compile Python sources
        run: uv run python -m compileall -q scripts tests

      - name: Run portable test suite
        run: uv run python -m unittest discover -s tests -v
