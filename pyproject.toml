[project]
name = "fe5110-stock-clustering-vine-risk"
version = "0.1.0"
description = "Reproducible data and modelling pipeline for the FE5110 project"
requires-python = ">=3.12,<3.14"
dependencies = [
  "arch>=7.2,<8",
  "boto3>=1.34,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=16,<24",
]

[dependency-groups]
dev = [
  "ruff==0.12.12",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "C4", "RUF100"]
