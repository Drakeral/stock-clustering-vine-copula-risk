[study]
universe_name = "S&P 100 point-in-time research universe"
universe_as_of = "2020-01-02"
membership_snapshot_date = "2019-11-21"
sample_start = "2017-01-03"
sample_end = "2025-12-31"
initial_training_start = "2017-01-03"
initial_training_end = "2019-12-31"
out_of_sample_start = "2020-01-02"
out_of_sample_end = "2025-12-31"
training_window_years = 3
minimum_initial_coverage = 0.95
return_definition = "close-to-close split-and-dividend-adjusted log total return"

[universe]
membership_source_url = "https://en.wikipedia.org/w/index.php?title=S%26P_100&oldid=929329274"
gics_source_url = "https://en.wikipedia.org/w/index.php?title=List_of_S%26P_500_companies&oldid=933762580"
expected_security_count = 101
expected_gics_sector_count = 11
include_multiple_share_classes = true

[massive]
rest_base_url = "https://api.massive.com"
flat_file_endpoint = "https://files.massive.com"
flat_file_bucket = "flatfiles"
daily_aggregate_prefix = "us_stocks_sip/day_aggs_v1"
flat_file_prices_are_split_adjusted = false
flat_file_prices_are_dividend_adjusted = false
rest_api_key_env = "MASSIVE_API_KEY"
s3_access_key_env = "MASSIVE_S3_ACCESS_KEY"
s3_secret_key_env = "MASSIVE_S3_SECRET_KEY"

[paths]
universe_json = "data/raw/universe_sp100_2020-01-02.json"
universe_source_manifest_json = "data/manifests/universe_source_manifest.json"
licensed_universe_csv = "data/raw/licensed/universe_sp100_2020-01-02.csv"
licensed_normalized_universe_json = "data/interim/licensed/universe_sp100_2020-01-02.json"
licensed_reconciliation_json = "data/interim/licensed/universe_reconciliation.json"
